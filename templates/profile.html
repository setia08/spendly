{% extends "base.html" %}

{% block title %}Your profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Your profile</h1>
            <p class="auth-subtitle">Account details for your Spendly account</p>
        </div>

        <div class="auth-card profile-card">
            <div class="profile-avatar">{{ user['name'][0] | upper }}</div>

            <div class="profile-field">
                <i data-lucide="user" class="profile-field-icon"></i>
                <div class="profile-field-text">
                    <span class="profile-label">Name</span>
                    <span class="profile-value">{{ user['name'] }}</span>
                </div>
            </div>

            <div class="profile-field">
                <i data-lucide="mail" class="profile-field-icon"></i>
                <div class="profile-field-text">
                    <span class="profile-label">Email</span>
                    <span class="profile-value">{{ user['email'] }}</span>
                </div>
            </div>

            <div class="profile-field">
                <i data-lucide="calendar" class="profile-field-icon"></i>
                <div class="profile-field-text">
                    <span class="profile-label">Member since</span>
                    <span class="profile-value">{{ member_since }}</span>
                </div>
            </div>
        </div>

    </div>
</section>

{% endblock %}
